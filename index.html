<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gine og Nikolai — Bryllaup 20. mai 2028</title>
<meta name="description" content="Bryllaup 20. mai 2028. Meir informasjon kjem.">
<meta property="og:title" content="Gine og Nikolai — Bryllaup 20. mai 2028">
<meta property="og:description" content="20. mai 2028. Meir informasjon kjem.">
<meta property="og:image" content="https://gineognikolai.com/gine-nikolai.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='21' r='8.5' fill='none' stroke='%23e8b44a' stroke-width='3'/%3E%3Cpath d='M16 2.5 22 9 16 15.5 10 9Z' fill='%23bfe4f5' stroke='%23f2fbff' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  .lang-switch {
    position: fixed;
    top: 1.5rem;
    right: 1.5rem;
    z-index: 1;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
  }
  .lang-switch button {
    font: inherit;
    letter-spacing: inherit;
    color: #fff;
    background: none;
    border: none;
    padding: 0.2em;
    opacity: 0.55;
    cursor: pointer;
  }
  .lang-switch button[aria-current="true"] {
    opacity: 0.95;
    text-decoration: underline;
    text-underline-offset: 0.25em;
  }
  .lang-switch button:hover { opacity: 0.9; }
  .lang-switch span { opacity: 0.4; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: #1a1512 url("gine-nikolai.jpg") center / cover no-repeat;
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    color: #fff;
    text-align: center;
    text-wrap: balance;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgb(0 0 0 / 35%), rgb(0 0 0 / 65%));
  }
  main { position: relative; }
  h1 {
    font-size: clamp(2.5rem, 11vw, 5.5rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .names {
    display: block;
    font-size: 0.42em;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 1.2em;
    opacity: 0.9;
  }
  p {
    margin-top: 1.6rem;
    font-size: clamp(1rem, 3.5vw, 1.35rem);
    letter-spacing: 0.12em;
    opacity: 0.85;
  }
  .date {
    font-size: clamp(1.3rem, 5vw, 2rem);
    letter-spacing: 0.08em;
    opacity: 0.95;
  }
  .date + p { margin-top: 0.8rem; font-size: clamp(0.85rem, 2.8vw, 1.05rem); opacity: 0.75; }
</style>
</head>
<body>
  <nav class="lang-switch" aria-label="Language">
    <button type="button" data-lang="nn">NN</button><span>/</span><button type="button" data-lang="nb">NB</button><span>/</span><button type="button" data-lang="en">EN</button>
  </nav>
  <main>
    <h1><span class="names" data-i18n="names">Gine &amp; Nikolai</span><span data-i18n="heading">Bryllaup</span></h1>
    <p class="date"><time datetime="2028-05-20" data-i18n="date">20. mai 2028</time></p>
    <p data-i18n="subtext">Meir informasjon kjem</p>
  </main>
  <script>
    var translations = {
      nn: {
        lang: "nn",
        title: "Gine og Nikolai — Bryllaup 20. mai 2028",
        description: "Bryllaup 20. mai 2028. Meir informasjon kjem.",
        ogTitle: "Gine og Nikolai — Bryllaup 20. mai 2028",
        ogDescription: "20. mai 2028. Meir informasjon kjem.",
        names: "Gine &amp; Nikolai",
        heading: "Bryllaup",
        date: "20. mai 2028",
        subtext: "Meir informasjon kjem"
      },
      nb: {
        lang: "nb",
        title: "Gine og Nikolai — Bryllup 20. mai 2028",
        description: "Bryllup 20. mai 2028. Mer informasjon kommer.",
        ogTitle: "Gine og Nikolai — Bryllup 20. mai 2028",
        ogDescription: "20. mai 2028. Mer informasjon kommer.",
        names: "Gine &amp; Nikolai",
        heading: "Bryllup",
        date: "20. mai 2028",
        subtext: "Mer informasjon kommer"
      },
      en: {
        lang: "en",
        title: "Gine and Nikolai — Wedding 20 May 2028",
        description: "Wedding 20 May 2028. More details to come.",
        ogTitle: "Gine and Nikolai — Wedding 20 May 2028",
        ogDescription: "20 May 2028. More details to come.",
        names: "Gine &amp; Nikolai",
        heading: "Wedding",
        date: "20 May 2028",
        subtext: "More details to come"
      }
    };

    function applyLang(lang) {
      var t = translations[lang] || translations.nn;
      document.documentElement.lang = t.lang;
      document.title = t.title;
      document.querySelector('meta[name="description"]').setAttribute("content", t.description);
      document.querySelector('meta[property="og:title"]').setAttribute("content", t.ogTitle);
      document.querySelector('meta[property="og:description"]').setAttribute("content", t.ogDescription);
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.innerHTML = t[el.getAttribute("data-i18n")];
      });
      document.querySelectorAll(".lang-switch button").forEach(function (btn) {
        btn.setAttribute("aria-current", btn.getAttribute("data-lang") === t.lang ? "true" : "false");
      });
      localStorage.setItem("lang", t.lang);
    }

    document.querySelectorAll(".lang-switch button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        applyLang(btn.getAttribute("data-lang"));
      });
    });

    applyLang(localStorage.getItem("lang") || "nn");
  </script>
</body>
</html>
